<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">SharkParty</title>
  <desc id="desc">A shark's snout surges up through a broken violet and teal sonar ring, one eye visible above a wide red mouth of sharp teeth.</desc>
  <defs>
    <linearGradient id="sonar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B68C8"/>
      <stop offset="1" stop-color="#3FE0C5"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9BCCD"/>
      <stop offset=".55" stop-color="#8FA3B8"/>
      <stop offset="1" stop-color="#6E8299"/>
    </linearGradient>
    <linearGradient id="jaw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#C6D3E1"/>
    </linearGradient>
    <radialGradient id="mouth" cx=".53" cy=".82" r=".83">
      <stop offset="0" stop-color="#941B35"/>
      <stop offset=".68" stop-color="#C82C44"/>
      <stop offset="1" stop-color="#E2604F"/>
    </radialGradient>
    <clipPath id="mouthClip">
      <path d="M263 166 C295 176 320 218 333 274 C341 309 341 345 337 377 C302 354 263 340 219 340 C182 340 148 353 118 375 C146 305 182 231 224 184 C239 169 253 162 263 166Z"/>
    </clipPath>
  </defs>

  <!-- The broken Deadfin-style sonar ring sits behind the rising snout. -->
  <circle cx="200" cy="200" r="168" fill="none" stroke="url(#sonar)" stroke-width="10" stroke-linecap="round" stroke-dasharray="700 120" stroke-dashoffset="-160"/>
  <path d="M266 54 C314 75 344 111 358 155" fill="none" stroke="#B5ABE1" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <path d="M358 237 C353 269 341 291 324 309" fill="none" stroke="#3FE0C5" stroke-width="3" stroke-linecap="round" opacity=".55"/>

  <!-- Bubbles double as restrained party confetti. -->
  <g fill="none" stroke="#3FE0C5" stroke-width="4">
    <circle cx="145" cy="113" r="7"/>
    <circle cx="119" cy="145" r="5"/>
    <circle cx="168" cy="137" r="4"/>
  </g>
  <path d="M189 89 l6 -10 l6 10 l-6 10Z" fill="#7B68C8"/>

  <!-- Only the head is visible; the rest of the shark continues below the icon. -->
  <path d="M240 82 C258 76 274 101 290 133 C326 203 352 291 354 400 H63 C65 354 85 301 118 245 C155 182 208 105 240 82Z" fill="url(#skin)"/>
  <path d="M241 88 C259 85 269 102 277 116 C269 111 257 111 246 116 C202 153 149 227 108 308 C132 227 205 107 241 88Z" fill="#D0DCE7" opacity=".47"/>
  <path d="M249 92 C256 91 264 98 269 108 C268 116 260 121 252 119 C245 116 241 107 249 92Z" fill="#E8EEF2" opacity=".64"/>

  <!-- One near-side eye and gills make the close-up read as a shark. -->
  <path d="M167 166 C175 155 189 155 195 163" fill="none" stroke="#34475D" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="180" cy="177" rx="10" ry="15" transform="rotate(23 180 177)" fill="#111C2B"/>
  <ellipse cx="176" cy="171" rx="2.5" ry="4" transform="rotate(23 176 171)" fill="#F7FAFC"/>
  <g fill="none" stroke="#26384B" stroke-width="7" stroke-linecap="round" opacity=".82">
    <path d="M143 225 C133 238 128 256 128 274"/>
    <path d="M125 245 C115 262 110 279 111 297"/>
    <path d="M106 264 C98 282 95 299 98 315"/>
  </g>

  <!-- Pale lip, open coral-red mouth, and two rows of pointed teeth. -->
  <path d="M256 135 C289 135 320 181 338 241 C351 286 357 347 350 400 H91 C115 336 161 244 211 178 C229 151 246 137 256 135Z" fill="url(#jaw)"/>
  <path d="M263 166 C295 176 320 218 333 274 C341 309 341 345 337 377 C302 354 263 340 219 340 C182 340 148 353 118 375 C146 305 182 231 224 184 C239 169 253 162 263 166Z" fill="url(#mouth)"/>
  <g clip-path="url(#mouthClip)">
    <path d="M176 238 C211 192 243 169 264 169 C292 180 317 219 329 274" fill="none" stroke="#8E1731" stroke-width="7" opacity=".72"/>
    <path d="M147 350 C178 312 206 285 243 276 C277 270 312 288 342 331 L342 389 C305 359 260 340 220 340 C190 340 163 348 129 373Z" fill="#A51C37" opacity=".78"/>
    <!-- Upper teeth point into the mouth, following its sloped arch. -->
    <path d="M189 217 L207 251 L211 197Z M212 191 L226 231 L234 179Z M235 174 L248 216 L260 164Z M263 164 L274 216 L289 181Z M289 181 L293 233 L309 206Z M309 207 L307 261 L323 236Z M324 238 L313 285 L335 276Z" fill="#F7FAFC"/>
    <!-- Lower teeth are tighter and more jagged than the original concept. -->
    <path d="M118 379 L148 327 L153 371Z M151 366 L176 318 L185 353Z M182 351 L209 301 L219 342Z M216 342 L244 300 L251 344Z M249 346 L278 310 L283 351Z M282 352 L308 322 L316 369Z M313 371 L330 345 L343 386Z" fill="#F7FAFC"/>
  </g>
  <path d="M91 400 C125 363 169 344 220 344 C268 344 316 360 350 400Z" fill="url(#jaw)"/>

  <!-- A lower sonar sweep passes in front as the head breaches the ring. -->
  <path d="M61 311 C103 390 285 410 344 323" fill="none" stroke="#3FE0C5" stroke-width="10" stroke-linecap="round"/>
</svg>
